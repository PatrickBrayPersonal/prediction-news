[tool.poetry]
name = "prediction-news"
version = "0.1.0"
description = "Prediction market news aggregator"
authors = ["Patrick Bray"]
readme = "README.md"
packages = [{include = "prediction_news"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.136.3"
uvicorn = {extras = ["standard"], version = "^0.48.0"}
anthropic = "^0.105.0"
python-dotenv = "^1.2.2"
httpx = "^0.28.1"
cryptography = "^48.0.0"
feedparser = "^6.0"
pydantic-settings = "^2.0"
cachetools = "^7.1.4"
tenacity = "^9.1.4"
loguru = "^0.7"
pip-system-certs = "^5.3"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.24"
pytest-cov = "^5.0"
respx = "^0.21"
types-cachetools = "^7.0.0.20260518"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
